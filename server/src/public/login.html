<!doctype html>
<html lang="es">

<head>
    <script>
        if (location.protocol === 'https:') {
            location.replace('http://' + location.host + location.pathname + location.search + location.hash);
        }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZENTRIK · Acceso</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/login.css">
    <style>
        /* Mini ficha bajo el input */
        .whois-chip {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: .92rem;
            line-height: 1.25;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .10);
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            color: rgba(255, 255, 255, .92);
            display: none;
        }

        .whois-chip.show {
            display: block;
        }

        .whois-chip.ok {
            border-color: rgba(83, 200, 255, .35);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
        }

        .whois-chip.bad {
            color: #ffb8b8;
            border-color: rgba(255, 80, 80, .35);
        }

        .whois-chip .code {
            opacity: .9;
            font-weight: 600;
            letter-spacing: .3px;
        }

        .whois-chip .name {
            display: block;
            margin-top: 2px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- Pantalla centrada, sin scroll -->
    <main class="screen screen--login">
        <section class="login-card" id="loginCard">
            <div class="login-brand">
                <img class="logo-mini" src="/img/ZENTRIK.png" alt="ZENTRIK" />
                <small class="sub">Acceso a ZENTRIK</small>
            </div>

            <div class="field">
                <label class="lbl" for="codigo">Código FISA</label>
                <input id="codigo" class="input-mini" placeholder="Ingresa código FISA" inputmode="numeric"
                    autocomplete="one-time-code" maxlength="5" />
                <!-- Identificación en vivo -->
                <div id="whois" class="whois-chip" aria-live="polite"></div>
            </div>

            <div class="field">
                <label class="lbl">Turno</label>
                <div id="turnos" class="turn-grid"></div>
            </div>

            <button id="btnLogin" type="button" class="btn-mini primary">Iniciar</button>
            <div id="msg" class="msg-mini"></div>
        </section>
    </main>

    <!-- scripts -->
    <script src="/js/auth.js"></script>
    <script>
        // Si YA hay sesión o podemos reanudar (y NO venimos de "cerrar turno"), salta el login
        (function () {
            try {
                var noResume = localStorage.getItem('rcn:noResume') === '1';
                var hasToken = !!(window.auth && window.auth.getToken && window.auth.getToken());
                var canResume = !!(localStorage.getItem('rcn:lastCode') && localStorage.getItem('rcn:lastTurno'));

                if (!noResume && (hasToken || canResume)) {
                    location.replace('/role.html');
                }
            } catch (e) { }
        })();
    </script>
    <script src="/js/api.js"></script>
    <script src="/js/guard.js"></script>
    <script src="/js/ws.js"></script>
    <script src="/js/device.js"></script>
    <script type="module" src="/js/login.js"></script>
</body>

</html>
